name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: dana-agent (lint / type / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dana-agent
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: dana-agent/uv.lock

      - name: Install Python (pinned)
        run: uv python install 3.13

      # uv.lock is respected: `uv sync --locked` fails if it doesn't match
      # pyproject.toml. The offline suite needs the pipecat/cloud SDKs, the
      # LangGraph checkpointer, and the chat-model integration packages —
      # still offline (no keys, no network calls).
      - name: Sync dependencies
        run: uv sync --python 3.13 --dev --extra cloud --extra brain --extra brain-openai --extra brain-google --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format (ruff format --check)
        run: uv run ruff format --check .

      - name: Type-check (mypy strict)
        run: uv run mypy

      - name: Test (pytest, offline)
        run: uv run pytest -m 'not live' --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: dana-agent/coverage.xml

  ui:
    name: dana-ui (typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dana-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dana-ui/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Manual only: hits the real Gemini API (needs the GOOGLE_API_KEY secret).
  # Run from the Actions tab ("Run workflow") — never on push.
  routing-eval:
    name: routing + chaining evals (real model)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dana-agent
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: dana-agent/uv.lock

      - name: Sync dependencies
        run: >
          uv sync --python 3.13 --dev --extra cloud --extra brain
          --extra brain-openai --extra brain-google --locked

      - name: Routing eval (40 utterances → expected tool calls)
        env:
          DANA_CONVERSATION__LLM__PROVIDER: gemini
          DANA_CONVERSATION__LLM__MODEL: gemini-2.5-flash-lite
          DANA_CONVERSATION__LLM__API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: uv run python scripts/action_routing_eval.py

      - name: Chaining eval (6 multi-turn scenarios through the Brain)
        env:
          DANA_CONVERSATION__LLM__PROVIDER: gemini
          DANA_CONVERSATION__LLM__MODEL: gemini-2.5-flash-lite
          DANA_CONVERSATION__LLM__API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: uv run python scripts/action_chaining_eval.py
