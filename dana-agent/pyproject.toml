[project]
name = "dana-agent"
version = "0.1.0"
description = "DaNa — always-on voice assistant (agent process)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

# Heavy / vendor-specific deps are optional extras, pulled in per phase so the
# core framework and its offline test suite install and run with none of them.
[project.optional-dependencies]
# Phase 3 — real-time engine + cloud conversation providers (latency-first stack)
# Upper bounds cap the next major where the research flagged churn risk (Pipecat
# is the fastest-moving dep; SDK majors can break clients). Floors stay at the
# APIs we actually call — assemblyai>=1.0 because the wake detector uses the
# streaming.v3 client. Verified against Aug 2026 latests (Pipecat 1.7, etc.).
cloud = [
    "pipecat-ai>=1.0,<2",
    "pyaudio>=0.2.14,<0.3",
    "deepgram-sdk>=3.0,<8",
    "google-genai>=1.0,<3",
    "assemblyai>=1.0,<2",
    "openai>=1.30,<3",
    "anthropic>=0.30,<1",
    "elevenlabs>=1.0,<3",
]
# Phase 3 — local CPU-only providers (also the local-only privacy mode)
local = [
    "faster-whisper>=1.0",
    "openwakeword>=0.6",
    "piper-tts>=1.2",
]
# Phase 2 — commercial wake word (default v1 wake engine)
wake = [
    "pvporcupine>=3.0",
]
# Phase 4 — brain (LangGraph graph + init_chat_model for provider-swappable LLMs).
# LangGraph/LangChain churn across 0.x minors → cap the next minor bump.
brain = [
    "langgraph>=0.2,<2",
    "langchain>=0.3,<2",
    "langchain-core>=0.3,<2",
    "langgraph-checkpoint-sqlite>=2.0,<4",
]
# Provider integrations for the brain's chat model (installed as needed).
brain-openai = ["langchain-openai>=0.2,<2"]
brain-google = ["langchain-google-genai>=2.0,<5"]
brain-anthropic = ["langchain-anthropic>=0.2,<2"]
# Phase 5 — action layer
actions = [
    "playwright>=1.44,<2",
]
# Phase 6 — control API + secrets vault + tray. pillow is pystray's image dep.
control = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "keyring>=25.0,<26",
    "pystray>=0.19,<0.20",
    "pillow>=10,<13",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # Brain deps are part of the dev env so the offline suite runs after a plain
    # `uv sync --dev` (still offline — no network, just the packages installed).
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    # Control-plane test deps: fastapi + httpx are pure-python and let the control
    # API suite run after a plain `uv sync --dev` — still offline (TestClient /
    # ASGITransport, no socket bind). uvicorn/pystray stay in the `control` extra.
    "fastapi>=0.111",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dana_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
# S101 (assert) is fine in tests; ABC contract checks rely on it. S105/S106
# (hardcoded "password") fire on dummy bearer tokens in the control-API tests.
# S104 (bind all interfaces) is intentional in the control-exposure guard tests,
# which assert that a 0.0.0.0/LAN bind is rejected/warned.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are constant sentinels, not mutable
# defaults — the framework requires them in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src", "tests"]

# LangChain/LangGraph are large and not fully typed for --strict; treat them as
# Any at the boundary rather than leaking their internals into our type checks.
[[tool.mypy.overrides]]
module = ["langchain.*", "langchain_core.*", "langgraph.*", "aiosqlite.*"]
ignore_missing_imports = true
follow_imports = "skip"

# Real provider SDKs — optional extras, stubs absent in CI / offline dev.
[[tool.mypy.overrides]]
module = [
    "assemblyai.*",
    "google.genai.*",
    "google.generativeai.*",
    "sounddevice.*",
    "pyaudio.*",
    "pipecat.*",
    "loguru.*",
    "elevenlabs.*",
    "deepgram.*",
    "playwright.*",
    # Control-plane runtime deps: uvicorn/pystray/keyring are the `control` extra
    # and are not installed for the offline suite (imported lazily where used).
    "uvicorn.*",
    "pystray.*",
    "keyring.*",
    "PIL.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# numpy stubs use 3.12 `type` syntax; skip to avoid false errors on 3.11 target.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_errors = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --cov=dana_agent --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits real providers/network; requires keys. Opt-in, never in CI (deselect with -m 'not live').",
]
