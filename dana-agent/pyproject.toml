[project]
name = "dana-agent"
version = "0.1.0"
description = "DaNa — always-on voice assistant (agent process)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

# Heavy / vendor-specific deps are optional extras, pulled in per phase so the
# core framework and its offline test suite install and run with none of them.
[project.optional-dependencies]
# Phase 3 — real-time engine + cloud conversation providers (latency-first stack)
cloud = [
    "pipecat-ai>=1.0",
    "pyaudio>=0.2.14",
    "deepgram-sdk>=3.0",
    "google-genai>=1.0",
    "assemblyai>=0.30",
    "openai>=1.30",
    "anthropic>=0.30",
    "elevenlabs>=1.0",
]
# Phase 3 — local CPU-only providers (also the local-only privacy mode)
local = [
    "faster-whisper>=1.0",
    "openwakeword>=0.6",
    "piper-tts>=1.2",
]
# Phase 2 — commercial wake word (default v1 wake engine)
wake = [
    "pvporcupine>=3.0",
]
# Phase 4 — brain (LangGraph graph + init_chat_model for provider-swappable LLMs)
brain = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
]
# Provider integrations for the brain's chat model (installed as needed).
brain-openai = ["langchain-openai>=0.2"]
brain-google = ["langchain-google-genai>=2.0"]
brain-anthropic = ["langchain-anthropic>=0.2"]
# Phase 5 — action layer
actions = [
    "playwright>=1.44",
]
# Phase 6 — control API + secrets vault
control = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "keyring>=25.0",
    "pystray>=0.19",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # Brain deps are part of the dev env so the offline suite runs after a plain
    # `uv sync --dev` (still offline — no network, just the packages installed).
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dana_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
# S101 (assert) is fine in tests; ABC contract checks rely on it.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src", "tests"]

# LangChain/LangGraph are large and not fully typed for --strict; treat them as
# Any at the boundary rather than leaking their internals into our type checks.
[[tool.mypy.overrides]]
module = ["langchain.*", "langchain_core.*", "langgraph.*", "aiosqlite.*"]
ignore_missing_imports = true
follow_imports = "skip"

# Real provider SDKs — optional extras, stubs absent in CI / offline dev.
[[tool.mypy.overrides]]
module = [
    "assemblyai.*",
    "google.genai.*",
    "google.generativeai.*",
    "sounddevice.*",
    "pyaudio.*",
    "pipecat.*",
    "loguru.*",
    "elevenlabs.*",
    "deepgram.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# numpy stubs use 3.12 `type` syntax; skip to avoid false errors on 3.11 target.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_errors = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --cov=dana_agent --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits real providers/network; requires keys. Opt-in, never in CI (deselect with -m 'not live').",
]
