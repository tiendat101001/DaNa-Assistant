# DaNa agent — example config file. Copy to dana.toml and edit.
# Precedence: environment > dana.toml > defaults. Secrets belong in .env or the
# OS secret store, NOT here. dana.toml is gitignored.

language = "en"
log_level = "INFO"

[wake]
provider = "mock"        # -> "porcupine" once Phase 2 lands
phrase = "Hey DaNa"
end_phrase = "Bye DaNa"
inactivity_timeout_s = 30.0

[conversation]
mode = "cascade"

[conversation.stt]
provider = "mock"        # -> "deepgram"
model = "mock-stt"

[conversation.llm]
provider = "mock"        # -> "gemini" | "openai" | "anthropic" | "openai_compat"
model = "mock-llm"
temperature = 0.7

[conversation.tts]
provider = "mock"        # -> "elevenlabs" | "piper"
voice = "default"

[brain]
max_steps = 8
# Long-conversation strategy: "none" | "trim" | "summarize".
history_strategy = "trim"
history_trigger_messages = 20
history_keep_last = 8

[brain.memory]
backend = "memory"       # "memory" | "sqlite"
# For sqlite: a file path (durable across restarts) or ":memory:" (in-memory DB).
sqlite_path = ".dana/brain.sqlite"

[actions]
provider = "mock"        # "mock" | "browser" (Playwright) | "os" (Windows)
gate_policy = "standard" # "standard" | "conservative" | "wide"
# Default-deny allowlists: empty means nothing is navigable / launchable.
allowed_domains = []     # e.g. ["example.com"] — host-suffix match, http(s) only
allowed_apps = []        # e.g. ["notepad", "spotify"] — names, never shell strings
max_actions_per_turn = 10
# Browser (Playwright) provider — dedicated, disposable profile (NOT real Chrome).
browser_profile_dir = ".dana/browser-profile"
browser_storage_state_path = ".dana/browser-state.json"
browser_headless = false
# OS (Windows) provider — dangerous, so OFF unless explicitly enabled.
os_actions_enabled = false
# Durable append-only JSONL audit trail of every gate decision/execution.
audit_path = ".dana/audit.jsonl"

[control]
host = "127.0.0.1"
port = 8760

[privacy]
local_only = false
audio_retention = "none"
